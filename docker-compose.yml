

services:
  postgres:
    image: postgres:15-alpine
    container_name: enterprise_postgres
    environment:
      POSTGRES_USER: ai_analyst
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: enterprise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    container_name: enterprise_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ai_analyst:secure_password_123@postgres:5432/enterprise_db
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - UI_PASSWORD=${UI_PASSWORD}
    depends_on:
      - postgres
      - qdrant
    restart: always

  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend
    container_name: enterprise_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - UI_PASSWORD=${UI_PASSWORD}
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  qdrant_data: